name: Verwechslungspaare Mondsee-Irrsee
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_similar.py']
permissions:
  contents: write
jobs:
  similar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_similar.py
      - name: Paare einspielen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/similar_pairs.json
          git commit -m "Verwechslungspaare aktualisiert" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
