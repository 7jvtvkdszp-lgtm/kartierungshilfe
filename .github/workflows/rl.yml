name: Rote Liste aufbereiten
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/rl_source.json', 'scripts/build_rl.py']
permissions:
  contents: write
jobs:
  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_rl.py
      - name: rl.json einspielen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rl.json scripts/rl_names.json
          git commit -m "Rote Liste aufbereitet" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
