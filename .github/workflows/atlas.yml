name: Österreich-Atlas aktualisieren
on:
  schedule:
    - cron: '0 2 1 * *'   # am 1. jedes Monats
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_atlas.py inat
      - uses: actions/upload-artifact@v4
        with: { name: part-inat, path: part_inat.json, retention-days: 3 }
  gbif:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_atlas.py gbif
      - uses: actions/upload-artifact@v4
        with: { name: part-gbif, path: "part_gbif.json\nscripts/gbif_names.json", retention-days: 3 }
  merge:
    needs: [inat, gbif]
    if: always() && needs.inat.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: part-inat }
      - uses: actions/download-artifact@v4
        if: needs.gbif.result == 'success'
        with: { name: part-gbif }
      - run: python scripts/build_atlas.py merge
      - name: atlas.json einspielen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas.json scripts/gbif_names.json 2>/dev/null || git add atlas.json
          git commit -m "Österreich-Atlas aktualisiert" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
